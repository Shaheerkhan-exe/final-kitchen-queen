<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Order Counter — Kitchen Queen Karachi</title>
<meta name="description" content="Watch Kitchen Queen's kitchen in real time — live orders, meals served today and delivery stats across Karachi.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="live-counter">

<nav id="kqRail"></nav>
<header id="kqHeader"></header>

<main class="kq-main">
  <h1 class="kq-page-title">Live from the Counter</h1>
  <p class="kq-page-sub"><span class="kq-live-dot"></span> Real-time activity from our Karachi kitchen.</p>

  <div class="kq-stats">
    <div class="kq-stat-card"><i class="fa-solid fa-bowl-food"></i><div class="kq-stat-num" data-count="1284">0</div><div class="kq-stat-label">Meals served today</div></div>
    <div class="kq-stat-card"><i class="fa-solid fa-motorcycle"></i><div class="kq-stat-num" data-count="46">0</div><div class="kq-stat-label">Riders on the road</div></div>
    <div class="kq-stat-card"><i class="fa-solid fa-users"></i><div class="kq-stat-num" data-count="9720">0</div><div class="kq-stat-label">Happy families</div></div>
    <div class="kq-stat-card"><i class="fa-solid fa-stopwatch"></i><div class="kq-stat-num" data-count="42">0</div><div class="kq-stat-label">Avg. delivery (min)</div></div>
  </div>

  <div class="kq-section-head"><h2><i class="fa-solid fa-tower-broadcast"></i> Live Order Feed</h2></div>
  <div class="kq-info-card"><div id="kqFeed"></div></div>
</main>

<div class="kq-ticker" id="kqTicker"></div>

<footer id="kqFooter"></footer>
<div id="kqShellExtras"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
