<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Queen — Home-Cooked Desi Food Delivery in Karachi</title>
<meta name="description" content="Order authentic home-cooked Pakistani desi food in Karachi. Biryani, karahi, salan and daily fresh thalis delivered hot from Kitchen Queen's home kitchen.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="index">

<nav id="kqRail"></nav>
<header id="kqHeader"></header>

<main class="kq-main">

  <div id="heroCarousel" class="carousel slide kq-hero" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <div class="kq-hero-banner hero-gold">
          <img class="hero-food left" src="images/Chicken Biryani.webp" alt="Chicken Biryani">
          <div class="hero-copy">
            <span class="hero-kicker">FRIDAY FAMILY DEAL</span>
            <h1>2x <b>DESI</b><br><b>THALI</b></h1>
            <div class="hero-price"><s>Rs. 1,899</s><strong>Rs. 1,450</strong></div>
          </div>
          <img class="hero-food right" src="images/karahi.jpg" alt="Chicken Karahi">
        </div>
      </div>
      <div class="carousel-item">
        <div class="kq-hero-banner hero-dark">
          <img class="hero-food left" src="images/beef haleem.jpg" alt="Haleem">
          <div class="hero-copy">
            <span class="hero-kicker">WEEKEND SPECIAL</span>
            <h1>SLOW <b>COOKED</b><br><b>HALEEM</b></h1>
            <div class="hero-price"><s>Rs. 460</s><strong>Rs. 400</strong></div>
          </div>
          <img class="hero-food right" src="images/chicken haleem.jpg" alt="Chicken Haleem">
        </div>
      </div>
      <div class="carousel-item">
        <div class="kq-hero-banner hero-warm">
          <img class="hero-food left" src="images/Daal Chawal.jpg" alt="Daal Chawal">
          <div class="hero-copy">
            <span class="hero-kicker">GHAR KA KHANA BOX</span>
            <h1>FULL <b>DESI</b><br><b>BOX</b></h1>
            <div class="hero-price"><s>Rs. 1,290</s><strong>Rs. 999</strong></div>
          </div>
          <img class="hero-food right" src="images/Yellow daal.png" alt="Yellow Daal">
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Previous</span></button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Next</span></button>
  </div>

  <div class="kq-cats" id="kqCats"></div>

  <div class="kq-section-head">
    <h2><i class="fa-solid fa-bowl-food"></i> Today's Kitchen</h2>
    <a class="kq-read-more" href="menu.html">Weekly menu <i class="fa-solid fa-arrow-right"></i></a>
  </div>

  <div class="kq-grid" id="kqGrid"></div>

</main>

<footer id="kqFooter"></footer>
<div id="kqShellExtras"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
